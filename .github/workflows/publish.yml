name: publish

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "terraform/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish

env:
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::944671670298:role/terraform-axr

jobs:
  terraform:
    runs-on: ubuntu-latest
    outputs:
      bucket: ${{ steps.outputs.outputs.bucket }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE }}
          role-session-name: axr-ci-session

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Apply
        working-directory: ./terraform
        run: |
          terraform init
          terraform plan -out=planout
          terraform apply planout

      - name: Outputs
        id: outputs
        working-directory: ./terraform
        run: echo "bucket=$(terraform output -raw bucket)" >> "$GITHUB_OUTPUT"

  publish:
    runs-on: ubuntu-latest
    needs: terraform
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare build user
        run: |
          pacman -Syu --noconfirm git aws-cli-v2
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - name: Bootstrap paru
        run: |
          sudo -Hu builder git clone https://aur.archlinux.org/paru.git /home/builder/paru
          cd /home/builder/paru
          sudo -Hu builder makepkg --syncdeps --install --noconfirm

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE }}
          role-session-name: axr-ci-session

      - name: Publish missing packages
        env:
          BUCKET: ${{ needs.terraform.outputs.bucket }}
          AXR_SIGNING_KEY: ${{ secrets.AXR_SIGNING_KEY }}
        run: |
          gpg --batch --import <<< "$AXR_SIGNING_KEY"
          mirror="s3://$BUCKET/x86_64"
          staging=/home/builder/staging
          mkdir "$staging"
          aws s3 cp "$mirror/axr.db.tar.gz" "$staging/axr.db.tar.gz" || true
          aws s3 cp "$mirror/axr.files.tar.gz" "$staging/axr.files.tar.gz" || true
          published=$(aws s3 ls "$mirror/" | awk '{print $4}' || true)

          copy_source() {
            if [ ! -d "/home/builder/$1" ]; then
              cp -r "packages/$1" "/home/builder/$1"
              chown -R builder:builder "/home/builder/$1"
            fi
          }

          built=""
          build() {
            local name="$1"
            case " $built " in *" $name "*) return ;; esac
            copy_source "$name"
            local dep
            for dep in $(cd "/home/builder/$name" && sudo -Hu builder makepkg --printsrcinfo | awk '$1 == "depends" { print $3 }'); do
              [ -d "packages/$dep" ] && build "$dep"
            done
            (cd "/home/builder/$name" && sudo -Hu builder paru -Ui --noconfirm)
            built="$built $name"
          }

          new_files=""
          for dir in packages/*/; do
            name=$(basename "$dir")
            copy_source "$name"
            srcinfo=$(cd "/home/builder/$name" && sudo -Hu builder makepkg --printsrcinfo)
            file=$(awk '
              $1 == "pkgname" { pkgname = $3 }
              $1 == "pkgver" { pkgver = $3 }
              $1 == "pkgrel" { pkgrel = $3 }
              $1 == "arch" { arch = $3 }
              END { print pkgname "-" pkgver "-" pkgrel "-" arch ".pkg.tar.zst" }
            ' <<< "$srcinfo")
            if ! grep -qxF "$file" <<< "$published" || ! grep -qxF "$file.sig" <<< "$published"; then
              build "$name"
              cp "/home/builder/$name/$file" "$staging/$file"
              new_files="$new_files $file"
            fi
          done

          if [ -z "$new_files" ]; then
            echo "mirror is up to date"
            exit 0
          fi

          cd "$staging"
          for file in $new_files; do
            gpg --batch --yes --detach-sign "$file"
          done
          repo-add --sign axr.db.tar.gz $new_files

          for file in $new_files; do
            aws s3 cp "$file" "$mirror/$file" --cache-control "public, max-age=2592000"
            aws s3 cp "$file.sig" "$mirror/$file.sig" --cache-control "public, max-age=2592000"
          done
          aws s3 cp axr.db.tar.gz "$mirror/axr.db.tar.gz" --cache-control no-cache
          aws s3 cp axr.db.tar.gz "$mirror/axr.db" --cache-control no-cache
          aws s3 cp axr.db.tar.gz.sig "$mirror/axr.db.tar.gz.sig" --cache-control no-cache
          aws s3 cp axr.db.tar.gz.sig "$mirror/axr.db.sig" --cache-control no-cache
          aws s3 cp axr.files.tar.gz "$mirror/axr.files.tar.gz" --cache-control no-cache
          aws s3 cp axr.files.tar.gz "$mirror/axr.files" --cache-control no-cache
          aws s3 cp axr.files.tar.gz.sig "$mirror/axr.files.tar.gz.sig" --cache-control no-cache
          aws s3 cp axr.files.tar.gz.sig "$mirror/axr.files.sig" --cache-control no-cache

          keyring=$(find . -name "axr-keyring-*.pkg.tar.zst" -printf "%f\n" | head -1)
          if [ -n "$keyring" ]; then
            aws s3 cp "$keyring" "s3://$BUCKET/axr-keyring.pkg.tar.zst" --cache-control no-cache
            aws s3 cp "$keyring.sig" "s3://$BUCKET/axr-keyring.pkg.tar.zst.sig" --cache-control no-cache
          fi
